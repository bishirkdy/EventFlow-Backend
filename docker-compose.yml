services:

  postgres:
    image: postgres:17-alpine
    container_name: eventflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: eventflow-gateway
    ports:
      - "5000:8080"
    depends_on:
      - identity
      - event
      - registration
      - operations
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"

      Cors__AllowedOrigins__0: "${CORS_ORIGIN_0:-http://localhost:4200}"
      Cors__AllowedOrigins__1: "${CORS_ORIGIN_1:-https://localhost:4200}"

      ReverseProxy__Clusters__identity-cluster__Destinations__identity-api__Address: "http://eventflow-identity:8080/"
      ReverseProxy__Clusters__event-cluster__Destinations__event-api__Address: "http://eventflow-event:8080/"
      ReverseProxy__Clusters__registration-cluster__Destinations__registration-api__Address: "http://eventflow-registration:8080/"
      ReverseProxy__Clusters__operations-cluster__Destinations__operations-api__Address: "http://eventflow-operations:8080/"

    develop:
      watch:
        - action: rebuild
          path: ./src/Gateway
        - action: rebuild
          path: ./src/BuildingBlocks

  identity:
    build:
      context: .
      dockerfile: Dockerfile.identity
    container_name: eventflow-identity
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"

      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      InternalService__Key: "${INTERNAL_SERVICE_KEY}"

      Cors__AllowedOrigins__0: "${CORS_ORIGIN_0:-http://localhost:4200}"
      Cors__AllowedOrigins__1: "${CORS_ORIGIN_1:-https://localhost:4200}"

      ConnectionStrings__IdentityDatabase: "Host=postgres;Port=5432;Database=IdentityDatabase;Username=postgres;Password=${POSTGRES_PASSWORD}"

      Kafka__BootstrapServers: "kafka:9092"
    develop:
      watch:
        - action: rebuild
          path: ./src/Services/Identity
        - action: rebuild
          path: ./src/BuildingBlocks

  event:
    build:
      context: .
      dockerfile: Dockerfile.event
    container_name: eventflow-event
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"

      InternalService__Key: "${INTERNAL_SERVICE_KEY}"

      Cors__AllowedOrigins__0: "${CORS_ORIGIN_0:-http://localhost:4200}"
      Cors__AllowedOrigins__1: "${CORS_ORIGIN_1:-https://localhost:4200}"

      ConnectionStrings__EventCoreDatabase: "Host=postgres;Port=5432;Database=EventCoreDatabase;Username=postgres;Password=${POSTGRES_PASSWORD}"

      Services__Identity__BaseUrl: "http://eventflow-identity:8080/"
      Services__Registration__BaseUrl: "http://eventflow-registration:8080/"

      Jwt__SecretKey: "${JWT_SECRET_KEY}"

      Cloudinary__CloudName: "${CLOUDINARY_CLOUD_NAME}"
      Cloudinary__ApiKey: "${CLOUDINARY_API_KEY}"
      Cloudinary__ApiSecret: "${CLOUDINARY_API_SECRET}"

      Kafka__BootstrapServers: "kafka:9092"

    develop:
      watch:
        - action: rebuild
          path: ./src/Services/Event
        - action: rebuild
          path: ./src/BuildingBlocks

  kafka:
    image: apache/kafka:latest
    container_name: eventflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  registration:
    build:
      context: .
      dockerfile: Dockerfile.registration
    container_name: eventflow-registration
    ports:
      - "5003:8080"
    depends_on:
      postgres:
        condition: service_healthy
      event:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"

      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      InternalService__Key: "${INTERNAL_SERVICE_KEY}"

      Cors__AllowedOrigins__0: "${CORS_ORIGIN_0:-http://localhost:4200}"
      Cors__AllowedOrigins__1: "${CORS_ORIGIN_1:-https://localhost:4200}"

      ConnectionStrings__RegistrationDatabase: "Host=postgres;Port=5432;Database=RegistrationDatabase;Username=postgres;Password=${POSTGRES_PASSWORD}"

      Services__Event__BaseUrl: "http://eventflow-event:8080/"
      Services__Operations__BaseUrl: "http://eventflow-operations:8080/"

    develop:
      watch:
        - action: rebuild
          path: ./src/Services/Registration
        - action: rebuild
          path: ./src/BuildingBlocks

  operations:
    build:
      context: .
      dockerfile: Dockerfile.operations
    container_name: eventflow-operations
    ports:
      - "5004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
      registration:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"

      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      InternalService__Key: "${INTERNAL_SERVICE_KEY}"

      Cors__AllowedOrigins__0: "${CORS_ORIGIN_0:-http://localhost:4200}"
      Cors__AllowedOrigins__1: "${CORS_ORIGIN_1:-https://localhost:4200}"

      ConnectionStrings__OperationsDatabase: "Host=postgres;Port=5432;Database=OperationsDatabase;Username=postgres;Password=${POSTGRES_PASSWORD}"

      Services__Identity__BaseUrl: "http://eventflow-identity:8080/"
      Services__Event__BaseUrl: "http://eventflow-event:8080/"
      Services__Registration__BaseUrl: "http://eventflow-registration:8080/"

      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__UseSsl: "${SMTP_USE_SSL:-true}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__From: "${SMTP_FROM:-}"

      Kafka__BootstrapServers: "kafka:9092"

    develop:
      watch:
        - action: rebuild
          path: ./src/Services/Operations
        - action: rebuild
          path: ./src/BuildingBlocks

volumes:
  postgres-data:
