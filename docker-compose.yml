services:

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: eventflow-gateway
    ports:
      - "5000:8080"
    depends_on:
      - identity
      - event
      - registration
      - operations
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ReverseProxy__Clusters__identity-cluster__Destinations__identity-api__Address: "http://eventflow-identity:8080/"
      ReverseProxy__Clusters__event-cluster__Destinations__event-api__Address: "http://eventflow-event:8080/"
      ReverseProxy__Clusters__registration-cluster__Destinations__registration-api__Address: "http://eventflow-registration:8080/"
      ReverseProxy__Clusters__operations-cluster__Destinations__operations-api__Address: "http://eventflow-operations:8080/"

    develop:
      watch:
        - action: rebuild
          path: ./src/Gateway
        - action: rebuild
          path: ./src/BuildingBlocks

  identity:
    build:
      context: .
      dockerfile: Dockerfile.identity
    container_name: eventflow-identity
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      InternalService__Key: "${INTERNAL_SERVICE_KEY}"

      ConnectionStrings__IdentityDatabase: "Host=host.docker.internal;Port=5432;Database=IdentityDatabase;Username=postgres;Password=${POSTGRES_PASSWORD}"

    develop:
      watch:
        - action: rebuild
          path: ./src/Services/Identity
        - action: rebuild
          path: ./src/BuildingBlocks

  event:
    build:
      context: .
      dockerfile: Dockerfile.event
    container_name: eventflow-event
    ports:
      - "5002:8080"
    depends_on:
      - identity
      - kafka
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      InternalService__Key: "${INTERNAL_SERVICE_KEY}"

      ConnectionStrings__EventCoreDatabase: "Host=host.docker.internal;Port=5432;Database=EventCoreDatabase;Username=postgres;Password=${POSTGRES_PASSWORD}"

      Services__Identity__BaseUrl: "http://eventflow-identity:8080/"

      Jwt__SecretKey: "${JWT_SECRET_KEY}"

      Cloudinary__CloudName: "${CLOUDINARY_CLOUD_NAME}"
      Cloudinary__ApiKey: "${CLOUDINARY_API_KEY}"
      Cloudinary__ApiSecret: "${CLOUDINARY_API_SECRET}"

      Kafka__BootstrapServers: "kafka:9092"

    develop:
      watch:
        - action: rebuild
          path: ./src/Services/Event
        - action: rebuild
          path: ./src/BuildingBlocks

  kafka:
    image: apache/kafka:latest
    container_name: eventflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  registration:
    build:
      context: .
      dockerfile: Dockerfile.registration
    container_name: eventflow-registration
    ports:
      - "5003:8080"
    depends_on:
      - event
      - kafka
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      InternalService__Key: "${INTERNAL_SERVICE_KEY}"

      ConnectionStrings__RegistrationDatabase: "Host=host.docker.internal;Port=5432;Database=RegistrationDatabase;Username=postgres;Password=${POSTGRES_PASSWORD}"

      Services__Event__BaseUrl: "http://eventflow-event:8080/"
      Services__Operations__BaseUrl: "http://eventflow-operations:8080/"

    develop:
      watch:
        - action: rebuild
          path: ./src/Services/Registration
        - action: rebuild
          path: ./src/BuildingBlocks

  operations:
    build:
      context: .
      dockerfile: Dockerfile.operations
    container_name: eventflow-operations
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      InternalService__Key: "${INTERNAL_SERVICE_KEY}"

      ConnectionStrings__OperationsDatabase: "Host=host.docker.internal;Port=5432;Database=OperationsDatabase;Username=postgres;Password=${POSTGRES_PASSWORD}"

      Services__Identity__BaseUrl: "http://eventflow-identity:8080/"
      Services__Event__BaseUrl: "http://eventflow-event:8080/"
      Services__Registration__BaseUrl: "http://eventflow-registration:8080/"

    depends_on:
      - identity
      - registration

    develop:
      watch:
        - action: rebuild
          path: ./src/Services/Operations
        - action: rebuild
          path: ./src/BuildingBlocks